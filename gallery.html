<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri Komponen · Learn Arduino</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      .gallery {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
      }
      .gallery-stage {
        position: relative;
        min-width: 0;
      }
      .gallery-panel {
        overflow-y: auto;
        padding: 18px 18px 30px;
        background: var(--card);
        border-left: 1px solid var(--line);
      }
      .gallery-panel h1 {
        margin: 0 0 4px;
        font: 700 20px var(--f-display);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .gallery-panel > p {
        margin: 0 0 14px;
        font-size: 13px;
        color: var(--muted);
      }
      .gallery-summary {
        padding: 8px 10px;
        border-radius: 6px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .gallery-summary.ok {
        background: var(--teal-soft);
        color: var(--teal-ink);
      }
      .gallery-summary.bad {
        background: #f8dcd8;
        color: #9b2a20;
      }
      .comp {
        width: 100%;
        display: block;
        text-align: left;
        padding: 10px 12px;
        margin-bottom: 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      .comp:hover {
        border-color: var(--teal);
      }
      .comp b {
        font: 700 14px var(--f-display);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .comp code {
        margin-left: 6px;
      }
      .comp small {
        display: block;
        margin-top: 3px;
        color: var(--ink-2);
        font-size: 12.5px;
      }
      .comp .status {
        float: right;
        font-weight: 700;
      }
      .comp .status.ok {
        color: var(--teal);
      }
      .comp .status.bad {
        color: var(--red);
      }
      .comp ul {
        margin: 6px 0 0;
        padding-left: 18px;
        color: #9b2a20;
        font-size: 12.5px;
      }
    </style>
  </head>
  <body>
    <div class="gallery">
      <main class="gallery-stage" id="stage">
        <canvas id="canvas" aria-label="Galeri komponen 3D"></canvas>
        <div class="tip" id="tip" role="tooltip" hidden><b></b><span></span></div>
      </main>
      <aside class="gallery-panel">
        <h1>Galeri komponen</h1>
        <p>Alat pengembang: semua komponen di registry, titik teal = pin. Hover titik untuk nama pin; klik daftar untuk memfokuskan.</p>
        <div class="gallery-summary" id="summary">Memeriksa…</div>
        <div id="list"></div>
      </aside>
    </div>
    <script type="module" src="/src/sandbox/gallery.js"></script>
  </body>
</html>
