<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Komponen · Learn Arduino</title>
    <meta name="description" content="Semua komponen Arduino di Learn Arduino dalam 3D: pin, pengaturan, dan cara mencobanya di sandbox." />
    <meta name="theme-color" content="#f5ecdc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="cat">
    <header class="cat-top">
      <a class="cat-brand" href="./" data-i18n-title="sb.back.title"><span data-logo></span><b>Learn Arduino</b></a>
      <h1 data-i18n="top.catalog">Katalog komponen</h1>
      <input class="cat-search" id="search" type="search" data-i18n-placeholder="sb.search" data-i18n-aria="sb.search.aria" placeholder="Cari komponen…" />
      <div class="cat-actions">
        <a class="top-btn top-primary" href="/sandbox.html" data-icon="breadboard"><span data-i18n="top.sandbox">Sandbox</span></a>
        <a class="top-btn" href="./" data-i18n="sb.lessons">← Pelajaran</a>
        <div class="account-slot"></div>
        <div class="cat-lang"></div>
      </div>
    </header>
    <nav class="cat-tabs" id="tabs" role="tablist"></nav>
    <div class="cat-main">
      <main class="cat-stage" id="stage">
        <canvas id="canvas" data-i18n-aria="cat.canvas" aria-label="Komponen 3D"></canvas>
        <div class="tip" id="tip" role="tooltip" hidden><b></b><span></span></div>
        <p class="cat-hint" data-i18n="cat.hint">Klik komponen untuk melihat detailnya · seret untuk menggeser · scroll untuk zoom</p>
      </main>
      <aside class="cat-panel">
        <div class="cat-detail" id="detail" hidden></div>
        <p class="cat-count" id="count"></p>
        <div class="cat-list" id="list"></div>
      </aside>
    </div>
    <script type="module" src="/src/sandbox/gallery.js"></script>
  </body>
</html>
