<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Learn Arduino</title>
    <meta name="description" content="Belajar Arduino lewat papan 3D interaktif: rangkai LED, tombol, sensor, motor, dan servo, lalu jalankan kodenya dan lihat hasilnya. 11 pelajaran dasar." />
    <meta name="theme-color" content="#f5ecdc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader-inner">
        <span data-logo></span>
        <p class="loader-title">Learn Arduino</p>
        <div class="loader-track" aria-hidden="true"><span class="loader-fill"></span></div>
        <p class="loader-step" data-i18n="load.loading">Memuat</p>
        <noscript><p>Aktifkan JavaScript untuk memulai kursus 3D interaktif ini. · Enable JavaScript to start this interactive 3D course.</p></noscript>
      </div>
    </div>

    <div id="app" class="app" inert>
      <svg class="decor" id="decor" aria-hidden="true"></svg>

      <nav class="sidebar" aria-label="Menu utama" data-i18n-aria="nav.menu">
        <button class="side-toggle" aria-label="Lebarkan menu" data-i18n-aria="nav.expand" aria-expanded="false"></button>
        <ul class="side-nav">
          <li><a href="#" data-nav="home" data-icon="home" title="Beranda" data-i18n-title="nav.home.title"><span class="nav-icon"></span><span class="side-label" data-i18n="nav.home">Beranda</span></a></li>
          <li><a href="#" data-nav="lessons" data-icon="book" title="Pelajaran" data-i18n-title="nav.lessons.title"><span class="nav-icon"></span><span class="side-label" data-i18n="nav.lessons">Pelajaran</span></a></li>
          <li><a href="#" data-nav="parts" data-icon="chip" title="Komponen" data-i18n-title="nav.parts.title"><span class="nav-icon"></span><span class="side-label" data-i18n="nav.parts">Komponen</span></a></li>
          <li><a href="#" data-nav="settings" data-icon="gear" title="Pengaturan" data-i18n-title="nav.settings.title"><span class="nav-icon"></span><span class="side-label" data-i18n="nav.settings">Pengaturan</span></a></li>
        </ul>
      </nav>
      <aside class="flyout" id="flyout" hidden></aside>

      <header class="brand">
        <span data-logo></span>
        <span class="brand-rule" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>Learn Arduino</h1>
          <p data-i18n="brand.tagline">Jelajahi <i>·</i> Pahami <i>·</i> Rakit</p>
        </div>
      </header>

      <div class="topbar">
        <a class="top-btn top-primary" href="/sandbox.html" data-icon="breadboard" data-i18n-aria="nav.sandbox.title" data-i18n-title="nav.sandbox.title"><span data-i18n="top.sandbox">Sandbox</span></a>
        <a class="top-btn" href="/gallery.html" data-icon="chip" data-i18n-aria="top.catalog" data-i18n-title="top.catalog"><span data-i18n="top.catalogShort">Katalog</span></a>
        <div class="account-slot"></div>
        <div class="top-lang"></div>
      </div>

      <main class="stage" id="stage">
        <canvas id="canvas" data-i18n-aria="stage.aria" aria-label="Tampilan 3D interaktif. Seret atau WASD untuk menggeser, Q dan E untuk memutar, scroll untuk zoom."></canvas>
        <svg class="leaders" id="leaders" aria-hidden="true"></svg>
        <div class="callouts" id="callouts"></div>
        <div class="inspector" id="inspector" role="dialog" aria-label="Pengaturan komponen" data-i18n-aria="insp.aria" hidden></div>
        <div class="tip" id="tip" role="tooltip" hidden><b></b><span></span></div>

        <div class="viewbar" id="viewbar" role="toolbar" aria-label="Tampilan 3D" data-i18n-aria="view.aria">
          <p class="view-hint" data-i18n="view.hint">Seret / WASD geser · Q / E putar · Scroll zoom</p>
          <button data-view="left" data-icon="rotLeft" title="Putar kiri (Q)" aria-label="Putar kiri" data-i18n-title="view.left.title" data-i18n-aria="view.left"></button>
          <button data-view="right" data-icon="rotRight" title="Putar kanan (E)" aria-label="Putar kanan" data-i18n-title="view.right.title" data-i18n-aria="view.right"></button>
          <span class="viewbar-sep"></span>
          <button data-view="out" data-icon="minus" title="Perkecil (−)" aria-label="Perkecil" data-i18n-title="view.out.title" data-i18n-aria="view.out"></button>
          <button data-view="in" data-icon="plus" title="Perbesar (+)" aria-label="Perbesar" data-i18n-title="view.in.title" data-i18n-aria="view.in"></button>
          <span class="viewbar-sep"></span>
          <button data-view="reset" data-icon="compass" class="compass" title="Kembalikan tampilan (R)" aria-label="Kembalikan tampilan" data-i18n-title="view.reset.title" data-i18n-aria="view.reset"></button>
        </div>
      </main>

      <section class="status" aria-label="Progres" data-i18n-aria="status.aria">
        <div class="progress-card">
          <svg viewBox="0 0 24 24" class="icon progress-icon" aria-hidden="true"><path d="M12 6.5C10 5 7 4.6 3.5 4.8v13.4c3.5-.2 6.5.3 8.5 1.8 2-1.5 5-2 8.5-1.8V4.8C17 4.6 14 5 12 6.5zM12 6.5V20" /></svg>
          <div class="progress-body">
            <span class="progress-label">Dasar</span>
            <div class="progress-row">
              <span class="progress-track" role="progressbar" aria-valuemin="0" aria-valuenow="0"><span class="progress-fill"></span></span>
              <span class="progress-count">0/11</span>
            </div>
          </div>
        </div>
        <time class="clock">
          <span id="clock-date"></span>
          <span id="clock-time"></span>
        </time>
      </section>

      <section class="info-card card" aria-label="Informasi pelajaran" data-i18n-aria="info.aria">
        <div class="tabs" role="tablist"></div>
        <div class="info-body">
          <button class="icon-btn expand" aria-label="Perbesar panel" data-i18n-aria="info.expand">
            <svg viewBox="0 0 24 24" class="icon"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" /><circle cx="12" cy="12" r="1.3" class="fill" /></svg>
          </button>
          <div class="info-content" role="tabpanel"></div>
        </div>
      </section>

      <section class="code-card card" aria-label="Coba sendiri" data-i18n-aria="code.title" data-state="idle">
        <header>
          <h2 data-i18n="code.title">Coba sendiri</h2>
          <div class="code-actions">
            <button class="icon-btn btn-expand" aria-label="Perbesar kode" title="Perbesar kode" data-i18n-aria="code.expand" data-i18n-title="code.expand" aria-expanded="false"></button>
            <button class="icon-btn btn-copy" aria-label="Salin kode" title="Salin kode" data-i18n-aria="code.copy" data-i18n-title="code.copy"></button>
            <button class="icon-btn btn-sandbox" data-i18n-aria="code.sandbox" data-i18n-title="code.sandbox.title" aria-label="Buka di sandbox" title="Buka di sandbox: ubah kode & rangkaian, jalankan di emulator"></button>
            <button class="btn-run" data-i18n-aria="code.run" data-i18n-title="code.run.title" aria-label="Jalankan sketch" title="Jalankan sketch (Spasi)"></button>
          </div>
        </header>
        <div class="code-wrap">
          <pre class="code"><code></code></pre>
          <div class="console">
            <div class="console-head">
              <span class="console-dot"></span>
              <span class="console-title">Serial Monitor</span>
              <span class="console-status" data-i18n="phase.idle">Berhenti</span>
              <button class="console-close" aria-label="Hentikan sketch" data-i18n-aria="code.stop"></button>
            </div>
            <div class="console-lines" aria-live="polite"></div>
            <form class="console-input" hidden autocomplete="off">
              <div class="console-hints"></div>
              <div class="console-row">
                <input type="text" placeholder="Ketik perintah, lalu Enter" aria-label="Kirim ke Serial" data-i18n-placeholder="code.input" data-i18n-aria="code.send.aria" />
                <button type="submit" data-i18n="code.send">Kirim</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="lessons" aria-label="Pelajaran" data-i18n-aria="nav.lessons">
        <div class="lessons-head">
          <h2 data-i18n="nav.lessons">Pelajaran</h2>
          <div class="level-tabs" role="tablist" aria-label="Level"></div>
        </div>
        <div class="strip">
          <button class="strip-arrow strip-prev" aria-label="Geser ke kiri" data-i18n-aria="strip.prev" hidden></button>
          <ol class="lesson-list"></ol>
          <button class="strip-arrow strip-next" aria-label="Geser ke kanan" data-i18n-aria="strip.next"></button>
        </div>
      </section>
      <!-- di dalam .app agar satu stacking context dengan panel yang diperbesar -->
      <div class="backdrop" id="backdrop"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
